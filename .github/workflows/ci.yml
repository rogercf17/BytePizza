name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bytepizza
          POSTGRES_USER: bytepizza
          POSTGRES_PASSWORD: bytepizza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bytepizza -d bytepizza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/bytepizza
      DB_USER: bytepizza
      DB_PASSWORD: bytepizza

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - run: chmod +x mvnw

      - run: ./mvnw -B verify